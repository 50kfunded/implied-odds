[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-odds"
version = "1.1.0"
description = "BTC and ETH risk forecasts, partial-outcome evidence monitoring and inference checks."
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "numpy>=2,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4", "arch>=8,<9"]

[project.optional-dependencies]
research = ["pypdf==6.1.1"]
dev = ["ruff==0.14.1", "mypy==1.18.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

[tool.mypy]
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
files = [
    "src/implied_calibration/exploratory_extensions.py",
    "src/implied_calibration/incremental.py",
    "src/implied_calibration/research_plan.py",
    "src/implied_calibration/inference_study.py",
    "src/implied_calibration/variance_forward.py",
    "src/implied_calibration/store.py",
    "src/implied_calibration/evaluation.py",
    "src/implied_calibration/relative_variance.py",
    "src/implied_calibration/relative_report.py",
    "src/implied_calibration/progressive_evidence.py",
    "src/implied_calibration/progressive_report.py",
    "src/implied_calibration/qlike_attribution.py",
    "src/implied_calibration/frequency_audit.py",
]
